<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>生活助手小七</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23f5f5f7'/%3E%3Cpath d='M18 17h28v7H34c-1 7-4 13-9 18l-6-5c4-4 7-8 8-13h-9zm16 12h8v18h-8z' fill='%230071e3'/%3E%3C/svg%3E" />
    <meta name="description" content="生活助手小七：自然、连续的语音与文字对话" />
    <meta name="theme-color" content="#f5f5f7" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            七
            <span id="brandStatus" class="brand-status"></span>
          </div>
          <div>
            <div class="eyebrow">XIAOQI VOICE</div>
            <h1>生活助手小七</h1>
            <p>自然地说，小七在听</p>
          </div>
        </div>
        <div class="top-actions">
          <button id="refreshHealth" class="icon-button" type="button" aria-label="刷新连接状态" title="刷新状态">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 4v5h5" />
              <path d="M4 13a8.1 8.1 0 0 0 15.5 2M20 20v-5h-5" />
            </svg>
          </button>
          <span id="connectionBadge" class="badge" role="status" aria-live="polite">连接中</span>
        </div>
      </div>
    </header>

    <main class="shell">
      <div class="side-stack">
        <section class="panel voice-panel" aria-label="连续语音模式">
          <div class="panel-head">
            <div>
              <div class="section-kicker">实时语音</div>
              <h3>语音模式</h3>
              <p id="voiceCapability" class="muted">检测中</p>
            </div>
            <span id="voiceBadge" class="badge" role="status" aria-live="polite">待机</span>
          </div>
          <div class="panel-body">
            <div class="device-routing" aria-label="语音输入与输出设备">
              <div class="device-route">
                <span class="device-route-label">输入设备</span>
                <div class="device-choice" role="group" aria-label="语音输入设备">
                  <button id="inputBrowser" class="secondary" type="button" aria-label="使用当前浏览器麦克风" aria-pressed="true">浏览器麦克风</button>
                  <button id="inputPi" class="secondary" type="button" aria-label="使用小七树莓派麦克风" aria-pressed="false">小七麦克风</button>
                </div>
              </div>
              <div class="device-route">
                <span class="device-route-label">输出设备</span>
                <div class="device-choice" role="group" aria-label="语音回复播放位置">
                  <button id="playBrowser" class="secondary" type="button" aria-label="当前浏览器播放语音回复" aria-pressed="true">浏览器扬声器</button>
                  <button id="playPi" class="secondary" type="button" aria-label="小七音箱播放语音回复" aria-pressed="false">小七音箱</button>
                </div>
              </div>
            </div>
            <div class="call-mode">
              <div class="call-mode-head">
                <div class="call-visual" aria-hidden="true">
                  <span id="callIndicator" class="call-indicator"></span>
                </div>
                <div class="call-copy">
                  <div class="call-title">VOICE MODE</div>
                  <div id="callState" class="call-state" aria-live="polite">轻点开启，直接对小七说话。</div>
                  <div class="call-note">输入和输出会遵循上方设备选择，回答结束后自动进入下一轮。</div>
                  <div id="voiceHint" class="voice-hint" role="status">正在检测浏览器麦克风。</div>
                </div>
              </div>
              <div class="call-actions">
                <button id="startCall" class="primary" type="button" disabled>开启语音</button>
                <button id="hangUp" class="secondary end-voice" type="button" disabled>结束语音</button>
              </div>
            </div>

            <div class="transcript-shell">
              <div class="transcript-label">
                <span class="section-kicker">实时转写</span>
                <span>仅保存在当前会话</span>
              </div>
              <div id="transcriptPreview" class="transcript-preview" role="status" aria-live="polite">转写预览会显示在这里。</div>
              <div id="voiceStatus" class="voice-status" role="status" aria-live="polite">准备好后，开启语音即可连续对话。</div>
            </div>

            <details class="advanced-controls">
              <summary>
                <span>手动录音</span>
                <span class="disclosure" aria-hidden="true">⌄</span>
              </summary>
              <div class="advanced-body">
                <label for="durationRange">最长录音时间</label>
                <div class="duration-row">
                  <input id="durationRange" type="range" min="5" max="300" step="5" />
                  <input id="durationNumber" type="number" min="5" max="300" step="5" aria-label="最长录音秒数" />
                </div>
                <div class="quick-row">
                  <button class="secondary" type="button" data-seconds="15">15 秒</button>
                  <button class="secondary" type="button" data-seconds="30">30 秒</button>
                  <button class="secondary" type="button" data-seconds="60">60 秒</button>
                  <button class="secondary" type="button" data-seconds="120">120 秒</button>
                </div>
                <div class="meter" aria-hidden="true"><div id="bar" class="bar"></div></div>
                <div class="button-row">
                  <button id="record" class="primary" type="button" disabled>浏览器录音</button>
                  <button id="piRecord" class="secondary" type="button" disabled>智能助手录音</button>
                  <button id="stop" class="danger" type="button" disabled>停止</button>
                </div>
              </div>
            </details>
          </div>
        </section>

        <section class="panel system-panel" aria-label="功能状态">
          <details>
            <summary class="system-summary">
              <div class="system-summary-copy">
                <div class="section-kicker">设备诊断</div>
                <h3>系统状态</h3>
              </div>
              <span class="disclosure" aria-hidden="true">⌄</span>
            </summary>
            <div class="panel-body">
              <div id="healthRows" class="status-list"></div>
            </div>
          </details>
        </section>
      </div>

      <section class="panel chat-panel" aria-label="聊天">
        <div class="chat-head">
          <div class="chat-title">
            <div class="section-kicker">对话记录</div>
            <h2 id="activeTitle">新会话</h2>
            <p id="activeMeta">准备就绪</p>
          </div>
          <span id="chatBadge" class="badge" role="status" aria-live="polite">待机</span>
        </div>

        <div id="messages" class="messages" role="log" aria-live="polite" aria-relevant="additions text">
          <div class="empty-state">正在加载会话。</div>
        </div>

        <form id="composer" class="composer">
          <label class="visually-hidden" for="textInput">文字输入</label>
          <textarea id="textInput" placeholder="输入消息…"></textarea>
          <div class="composer-actions">
            <div class="composer-controls">
              <label class="toggle" for="speakReply">
                <input id="speakReply" type="checkbox" disabled />
                朗读回复
              </label>
            </div>
            <span id="chatStatus" class="chat-status" role="status" aria-live="polite">当前会话会保存在树莓派本地。</span>
            <button id="sendText" class="primary" type="submit">发送</button>
          </div>
        </form>
      </section>

      <aside class="panel sidebar" aria-label="会话管理">
        <div class="panel-head">
          <div>
            <div class="section-kicker">会话历史</div>
            <h2>会话</h2>
            <p id="sessionCount" class="muted">加载中</p>
          </div>
          <button id="newSession" class="primary" type="button" aria-label="新建会话" title="新建会话">+</button>
        </div>
        <div id="sessionList" class="session-list"></div>
        <div class="session-tools">
          <details>
            <summary>
              <span>会话设置</span>
              <span class="disclosure" aria-hidden="true">⌄</span>
            </summary>
            <label for="sessionTitle">当前标题</label>
            <div class="rename-row">
              <input id="sessionTitle" type="text" maxlength="32" placeholder="新会话" />
              <button id="saveTitle" class="secondary" type="button">保存</button>
            </div>
            <button id="deleteSession" class="danger-outline" type="button">删除当前会话</button>
          </details>
        </div>
      </aside>
    </main>

    <script src="/call-mode.js"></script>
    <script src="/ui-motion.js"></script>
    <script>
      const $ = (selector) => document.querySelector(selector);
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      const els = {
        activeMeta: $("#activeMeta"),
        activeTitle: $("#activeTitle"),
        bar: $("#bar"),
        brandStatus: $("#brandStatus"),
        callIndicator: $("#callIndicator"),
        callState: $("#callState"),
        chatBadge: $("#chatBadge"),
        chatStatus: $("#chatStatus"),
        composer: $("#composer"),
        connectionBadge: $("#connectionBadge"),
        deleteSession: $("#deleteSession"),
        durationNumber: $("#durationNumber"),
        durationRange: $("#durationRange"),
        healthRows: $("#healthRows"),
        hangUp: $("#hangUp"),
        inputBrowser: $("#inputBrowser"),
        inputPi: $("#inputPi"),
        messages: $("#messages"),
        newSession: $("#newSession"),
        piRecord: $("#piRecord"),
        playBrowser: $("#playBrowser"),
        playPi: $("#playPi"),
        record: $("#record"),
        refreshHealth: $("#refreshHealth"),
        saveTitle: $("#saveTitle"),
        sendText: $("#sendText"),
        sessionCount: $("#sessionCount"),
        sessionList: $("#sessionList"),
        sessionTitle: $("#sessionTitle"),
        speakReply: $("#speakReply"),
        startCall: $("#startCall"),
        stop: $("#stop"),
        textInput: $("#textInput"),
        transcriptPreview: $("#transcriptPreview"),
        voiceBadge: $("#voiceBadge"),
        voiceCapability: $("#voiceCapability"),
        voiceHint: $("#voiceHint"),
        voiceStatus: $("#voiceStatus"),
      };

      const state = {
        busy: false,
        callActive: false,
        current: null,
        health: null,
        healthLoaded: false,
        healthFailed: false,
        inputTarget: localStorage.getItem("hermes.inputTarget") === "pi" ? "pi" : "browser",
        playTarget: localStorage.getItem("hermes.playTarget") === "pi" ? "pi" : "browser",
        sessions: [],
        duration: Number(localStorage.getItem("hermes.duration") || 60),
      };

      let recognition;
      let stream;
      let recorder;
      let chunks = [];
      let browserTranscript = "";
      let browserInterimTranscript = "";
      let recordingMimeType = "audio/webm";
      let recordingFilename = "recording.webm";
      let recordingSessionId = "";
      let recordedDuration = 1;
      let startedAt = 0;
      let timer;
      let progress;
      let submitted = false;
      let stopPending = false;
      let recordingMode = "";
      let recognitionDone = true;
      let recorderDone = true;
      let activeDuration = state.duration;
      let piRecordJobId = "";
      let piPoll;
      let piPollFailures = 0;
      let piStopRequested = false;
      let selectSessionRequest = 0;
      let callAudio;
      let callAudioContext;
      let callController;
      let callSessionId = "";

      function escapeHtml(value) {
        return String(value || "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function formatTime(value) {
        if (!value) return "";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "";
        return new Intl.DateTimeFormat("zh-CN", {
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
        }).format(date);
      }

      function setBadge(element, text, tone = "") {
        element.textContent = text;
        element.className = `badge ${tone}`.trim();
        window.XiaoQiUI?.bump(element);
      }

      function setChatStatus(text, tone = "") {
        els.chatStatus.textContent = text;
        els.chatStatus.className = `chat-status ${tone}`.trim();
      }

      function setVoiceStatus(text, tone = "") {
        els.voiceStatus.textContent = text;
        els.voiceStatus.className = `voice-status ${tone}`.trim();
      }

      function clampDuration(value) {
        const number = Number(value);
        if (!Number.isFinite(number)) return 60;
        return Math.max(5, Math.min(300, Math.round(number / 5) * 5));
      }

      function setDuration(value) {
        state.duration = clampDuration(value);
        els.durationRange.value = String(state.duration);
        els.durationNumber.value = String(state.duration);
        localStorage.setItem("hermes.duration", String(state.duration));
      }

      async function requestJSON(path, options = {}) {
        const headers = { ...(options.headers || {}) };
        const init = { method: options.method || "GET", headers };
        const requestController = new AbortController();
        const parentSignal = options.signal;
        let timedOut = false;
        const abortFromParent = () => requestController.abort();
        if (parentSignal) {
          if (parentSignal.aborted) requestController.abort();
          else parentSignal.addEventListener("abort", abortFromParent, { once: true });
        }
        init.signal = requestController.signal;
        if (options.body instanceof FormData) {
          init.body = options.body;
        } else if (options.body !== undefined) {
          headers["Content-Type"] = "application/json";
          init.body = typeof options.body === "string" ? options.body : JSON.stringify(options.body);
        }

        const configuredTimeout = Number(options.timeoutMs);
        const timeoutMs = Number.isFinite(configuredTimeout) && configuredTimeout > 0
          ? Math.max(1000, configuredTimeout)
          : 0;
        const timeoutId = timeoutMs
          ? setTimeout(() => {
              timedOut = true;
              requestController.abort();
            }, timeoutMs)
          : null;
        try {
          const response = await fetch(path, init);
          const text = await response.text();
          let data = {};
          if (text) {
            try {
              data = JSON.parse(text);
            } catch {
              data = { detail: text };
            }
          }
          if (!response.ok) {
            const error = new Error(data.detail || data.message || `HTTP ${response.status}`);
            error.status = response.status;
            error.code = data.code || "";
            error.retryable = data.retryable;
            throw error;
          }
          return data;
        } catch (error) {
          if (timedOut) {
            const timeoutError = new Error("请求超时，请检查服务连接后重试");
            timeoutError.code = "request_timeout";
            throw timeoutError;
          }
          throw error;
        } finally {
          if (timeoutId) clearTimeout(timeoutId);
          if (parentSignal) parentSignal.removeEventListener("abort", abortFromParent);
        }
      }

      function canUseBackendStt() {
        return Boolean(state.health && (!state.health.stt || state.health.stt.ready));
      }

      function canGenerateSpokenReply() {
        return Boolean(state.health && (!state.health.tts || state.health.tts.ready));
      }

      function browserMicrophoneAvailable() {
        return Boolean(
          window.isSecureContext &&
            navigator.mediaDevices &&
            typeof navigator.mediaDevices.getUserMedia === "function",
        );
      }

      function voiceAvailable() {
        if (!state.healthLoaded || state.healthFailed || !canGenerateSpokenReply()) return false;
        if (!browserMicrophoneAvailable()) return false;
        return Boolean(SpeechRecognition || (window.MediaRecorder && canUseBackendStt()));
      }

      function canUsePiRecord() {
        const piRecord = state.health && state.health.pi_record;
        return Boolean(piRecord && piRecord.available && canUseBackendStt() && canGenerateSpokenReply());
      }

      function canUsePiPlayback() {
        const piPlayback = state.health && state.health.pi_playback;
        return Boolean(piPlayback && piPlayback.available);
      }

      function selectedInputAvailable() {
        return state.inputTarget === "pi" ? canUsePiRecord() : voiceAvailable();
      }

      function piCallTurnDuration() {
        return Math.min(8, Math.max(5, Number(state.duration) || 8));
      }

      function piCallEndpointSummary() {
        const endpointing = state.health && state.health.pi_record && state.health.pi_record.endpointing;
        if (!endpointing || !endpointing.enabled) {
          return `每轮收音最多 ${piCallTurnDuration()} 秒`;
        }
        const configuredSilence = Number(endpointing.silence_seconds);
        const silenceSeconds = Number.isFinite(configuredSilence) && configuredSilence > 0
          ? configuredSilence
          : 1;
        return `说完安静约 ${silenceSeconds} 秒自动发送，最长 ${piCallTurnDuration()} 秒`;
      }

      function renderInputTarget() {
        const usePi = state.inputTarget === "pi";
        els.inputBrowser.classList.toggle("active", !usePi);
        els.inputPi.classList.toggle("active", usePi);
        els.inputBrowser.setAttribute("aria-pressed", String(!usePi));
        els.inputPi.setAttribute("aria-pressed", String(usePi));
        els.inputBrowser.title = !voiceAvailable() ? "当前浏览器麦克风未就绪" : "连续语音使用当前浏览器麦克风";
        els.inputPi.title = !canUsePiRecord() ? "小七麦克风未就绪" : "连续语音使用树莓派上的小七麦克风";
      }

      function setInputTarget(target) {
        if (target === "pi" && !canUsePiRecord()) {
          setChatStatus("小七麦克风尚未就绪，输入设备没有切换。", "warn");
          window.XiaoQiUI?.bump(els.inputPi);
          return;
        }
        if (target !== "pi" && !voiceAvailable()) {
          setChatStatus("当前浏览器麦克风尚未就绪，输入设备没有切换。", "warn");
          window.XiaoQiUI?.bump(els.inputBrowser);
          return;
        }
        state.inputTarget = target === "pi" ? "pi" : "browser";
        localStorage.setItem("hermes.inputTarget", state.inputTarget);
        renderInputTarget();
        renderHealth();
        setChatStatus(state.inputTarget === "pi" ? "输入已切换到小七麦克风。" : "输入已切换到当前浏览器麦克风。", "ok");
      }

      function renderPlayTarget() {
        if (state.health && state.playTarget === "pi" && !canUsePiPlayback()) {
          state.playTarget = "browser";
          localStorage.setItem("hermes.playTarget", "browser");
          setChatStatus("小七音箱当前不可用，已切回当前浏览器播放。", "warn");
        }
        const usePi = state.playTarget === "pi";
        els.playBrowser.classList.toggle("active", !usePi);
        els.playPi.classList.toggle("active", usePi);
        els.playBrowser.setAttribute("aria-pressed", String(!usePi));
        els.playPi.setAttribute("aria-pressed", String(usePi));
        els.playPi.title = !canUsePiPlayback() ? "小七音箱播放未就绪" : "回复会在小七音箱播放";
      }

      function setPlayTarget(target) {
        if (target === "pi" && !canUsePiPlayback()) {
          setChatStatus("小七音箱播放尚未就绪，仍使用当前浏览器。", "warn");
          window.XiaoQiUI?.bump(els.playPi);
          return;
        }
        state.playTarget = target === "pi" ? "pi" : "browser";
        localStorage.setItem("hermes.playTarget", state.playTarget);
        renderPlayTarget();
        setChatStatus(state.playTarget === "pi" ? "回复会发送到树莓派播放。" : "回复会在浏览器播放。");
      }

      function setWorkspaceLock(locked) {
        els.textInput.disabled = locked;
        els.sendText.disabled = locked;
        els.newSession.disabled = locked;
        els.speakReply.disabled = locked || !state.healthLoaded || !canGenerateSpokenReply();
        els.sessionTitle.disabled = locked || !state.current;
        els.saveTitle.disabled = locked || !state.current;
        els.deleteSession.disabled = locked || !state.current;
        els.sessionList.querySelectorAll("button").forEach((button) => {
          button.disabled = locked;
        });
      }

      function setIdleVoiceControls() {
        const locked = state.busy || state.callActive;
        els.record.disabled = locked || !voiceAvailable();
        els.piRecord.disabled = locked || !canUsePiRecord();
        els.stop.disabled = true;
        els.startCall.disabled = locked || !callController || !selectedInputAvailable();
        els.hangUp.disabled = !state.callActive;
        els.durationRange.disabled = locked;
        els.durationNumber.disabled = locked;
        els.inputBrowser.disabled = locked || state.healthFailed || Boolean(state.health && !voiceAvailable());
        els.inputPi.disabled = locked || state.healthFailed || Boolean(state.health && !canUsePiRecord());
        els.playBrowser.disabled = locked;
        els.playPi.disabled = locked || state.healthFailed || Boolean(state.health && !canUsePiPlayback());
        document.querySelectorAll("[data-seconds]").forEach((button) => {
          button.disabled = locked;
        });
        setWorkspaceLock(locked);
      }

      function renderHealth() {
        const health = state.health;
        if (!health) {
          setBadge(els.connectionBadge, "连接中");
          els.brandStatus.className = "brand-status";
          els.healthRows.innerHTML = '<div class="empty-state">正在读取状态。</div>';
          return;
        }

        setBadge(els.connectionBadge, health.ok ? "服务在线" : "服务受限", health.ok ? "ok" : "err");
        els.brandStatus.className = `brand-status ${health.ok ? "ok" : "err"}`;
        const chat = health.chat || {};
        const stt = health.stt || {};
        const tts = health.tts || {};
        const piRecord = health.pi_record || {};
        const piEndpointing = piRecord.endpointing || {};
        const piPlayback = health.pi_playback || {};
        const weather = health.weather || {};
        const briefing = health.briefing || {};
        const reminders = health.reminders || {};
        const rows = [
          ["Hermes CLI", health.hermes_cli ? "已连接" : "未找到", health.hermes_cli ? "ok" : "err"],
          ["模型配置", `${chat.provider || "-"} / ${chat.model || "-"} · ${chat.model ? "已配置" : "未配置"}`, chat.model ? "warn" : "err"],
          ["端点", chat.base_url || "默认配置", chat.base_url ? "ok" : "warn"],
          ["天气查询", weather.ready ? `${weather.provider || "Open-Meteo"} 可用` : "不可用", weather.ready ? "ok" : "warn"],
          ["今日简报", briefing.ready ? "可用" : "不可用", briefing.ready ? "ok" : "warn"],
          ["本地提醒", reminders.ready ? `${reminders.open_count || 0} 个未完成` : "不可用", reminders.ready ? "ok" : "warn"],
          [
            "浏览器麦克风",
            browserMicrophoneAvailable() ? (SpeechRecognition ? "可录音与转写" : "可录音上传") : "当前访问方式不可用",
            browserMicrophoneAvailable() ? "ok" : "warn",
          ],
          ["后端转写", stt.ready ? `${stt.provider || "-"} 就绪` : stt.detail || `${stt.provider || "-"} 未就绪`, stt.ready ? "ok" : "warn"],
          ["智能助手录音", piRecord.available ? `${piRecord.device || "auto"} / ${piRecord.rate || "-"} Hz` : piRecord.detail || "不可用", piRecord.available ? "ok" : "warn"],
          [
            "小七自动收句",
            piEndpointing.enabled ? `安静约 ${piEndpointing.silence_seconds || 1} 秒后发送` : "未启用",
            piEndpointing.enabled ? "ok" : "warn",
          ],
          ["树莓派播放", piPlayback.available ? `${piPlayback.player || "可用"}${piPlayback.device ? ` / ${piPlayback.device}` : ""}` : "不可用", piPlayback.available ? "ok" : "warn"],
          ["回复朗读", tts.ready ? `${tts.provider || "-"} ${tts.voice || ""}`.trim() : "未就绪", tts.ready ? "ok" : "err"],

        els.healthRows.innerHTML = rows
          .map(
            ([name, value, tone]) => `
              <div class="status-row">

                <div class="status-value">${escapeHtml(value)}</div>

        const browserOption = voiceAvailable() ? "当前浏览器麦克风可用" : "当前浏览器麦克风不可用";
        const piOption = canUsePiRecord() ? "小七本机麦克风可用" : "小七本机麦克风不可用";
        els.voiceCapability.textContent = `${browserOption}；${piOption}`;
        els.speakReply.checked =

        if (state.inputTarget === "pi" && canUsePiRecord()) {
          els.voiceHint.className = "voice-hint ok";
          els.voiceHint.textContent = `连续语音将使用小七麦克风；${piCallEndpointSummary()}。`;
        } else if (state.inputTarget === "pi") {
          els.voiceHint.className = "voice-hint err";
          els.voiceHint.textContent = "小七麦克风当前不可用，请刷新设备状态或切回浏览器麦克风。";
        } else if (!window.isSecureContext) {
          els.voiceHint.className = "voice-hint warn";
          els.voiceHint.textContent = microphoneUnavailableMessage();
        } else if (!browserMicrophoneAvailable()) {
          els.voiceHint.className = "voice-hint err";
          els.voiceHint.textContent = "当前浏览器没有提供可用的麦克风接口。";
        } else if (!canGenerateSpokenReply()) {
          els.voiceHint.className = "voice-hint warn";
          els.voiceHint.textContent = "语音回复合成尚未就绪，连续语音模式已暂停。";
        } else if (voiceAvailable()) {

        renderInputTarget();

      function renderSessions() {
        els.sessionCount.textContent = `${state.sessions.length} 个会话`;
        if (!state.sessions.length) {
          els.sessionList.innerHTML = '<div class="session-empty">还没有会话。</div>';
          return;
        }

        const activeId = state.current && state.current.id;
        els.sessionList.innerHTML = state.sessions
          .map((session) => {
            const active = session.id === activeId ? "active" : "";
            const current = session.id === activeId ? 'aria-current="true"' : "";
            return `
              <button class="session-item ${active}" type="button" data-session="${escapeHtml(session.id)}" ${current}>
                <span class="session-title">${escapeHtml(session.title || "新会话")}</span>
                <span class="session-meta">
                  <span>${session.message_count || 0} 条</span>
                  <span>${escapeHtml(formatTime(session.updated_at))}</span>
                </span>
                <span class="session-last">${escapeHtml(session.last_message || "暂无消息")}</span>
              </button>
            `;
          })
          .join("");

        els.sessionList.querySelectorAll("[data-session]").forEach((button) => {
          button.addEventListener("click", () => selectSessionFromUi(button.dataset.session));
          button.disabled = state.busy || state.callActive;

      function renderMessages() {
        if (!state.current) {
          els.messages.innerHTML = '<div class="empty-state">请选择或新建一个会话。</div>';
          return;
        }

        const messages = state.current.messages || [];
        if (!messages.length) {
          els.messages.innerHTML = '<div class="empty-state">这个会话还没有消息，可以从下方输入文字，或使用语音工作台。</div>';
          return;
        }

        els.messages.innerHTML = messages
          .map((message) => {
            const roleName = message.role === "user" ? "用户" : "小七";
            const kind = message.kind === "voice" ? "语音" : "文字";
            const audio = message.audio_url
              ? `<div class="message-audio"><audio controls preload="none" src="${escapeHtml(message.audio_url)}"></audio></div>`
              : "";
            return `
              <article class="message ${escapeHtml(message.role)}">
                <div class="message-meta">
                  <span>${roleName} · ${kind}</span>
                  <span>${escapeHtml(formatTime(message.created_at))}</span>
                </div>
                <div class="message-body">${escapeHtml(message.content)}</div>
                ${audio}
              </article>
            `;
          })
          .join("");
        els.messages.scrollTop = els.messages.scrollHeight;
        window.XiaoQiUI?.reveal(Array.from(els.messages.querySelectorAll(".message")).slice(-2), {
          duration: 240,
          fromY: 8,

      function renderCurrent() {
        const current = state.current;
        els.activeTitle.textContent = current ? current.title || "新会话" : "未选择会话";
        els.sessionTitle.value = current ? current.title || "新会话" : "";
        els.deleteSession.disabled = state.busy || state.callActive || !current;
        els.saveTitle.disabled = state.busy || state.callActive || !current;
        els.sessionTitle.disabled = state.busy || state.callActive || !current;
        const count = current && current.messages ? current.messages.length : 0;
        els.activeMeta.textContent = current ? `${count} 条消息 · ${formatTime(current.updated_at) || "刚刚"}` : "准备就绪";
        renderMessages();
        renderSessions();

      async function loadHealth() {
        try {
          state.health = await requestJSON("/health", { method: "GET", timeoutMs: 12000 });
          state.healthLoaded = true;
          state.healthFailed = false;
          renderHealth();
        } catch (error) {
          state.health = null;
          state.healthLoaded = true;
          state.healthFailed = true;
          if (state.playTarget === "pi") {
            state.playTarget = "browser";
            localStorage.setItem("hermes.playTarget", "browser");
          }
          setBadge(els.connectionBadge, "连接失败", "err");
          els.brandStatus.className = "brand-status err";
          els.healthRows.innerHTML = `<div class="empty-state">${escapeHtml(error.message)}</div>`;
          els.record.disabled = true;
          els.piRecord.disabled = true;
          els.startCall.disabled = true;
          els.voiceHint.className = "voice-hint err";
