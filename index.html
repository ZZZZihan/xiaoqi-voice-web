      async function loadSessions() {
        const data = await requestJSON("/api/sessions");
        state.sessions = data.sessions || [];
        renderSessions();
      }

      async function createSession() {
        selectSessionRequest += 1;
        const data = await requestJSON("/api/sessions", { method: "POST", body: { title: "新会话" } });
        state.sessions = data.sessions || [];
        state.current = data.session;
        localStorage.setItem("hermes.activeSession", state.current.id);
        renderCurrent();
        return state.current;
      }

      async function createSessionFromUi() {
        if (state.busy || state.callActive) return;
        state.busy = true;
        setIdleVoiceControls();
        setChatStatus("正在创建新会话。");
        try {
          await createSession();
          setChatStatus("新会话已创建。", "ok");
        } catch (error) {
          setChatStatus(error.message, "err");
        } finally {
          state.busy = false;
          setIdleVoiceControls();
        }
      }

      async function selectSession(sessionId) {
        if (!sessionId) return;
        const requestId = ++selectSessionRequest;
        try {
          const data = await requestJSON(`/api/sessions/${encodeURIComponent(sessionId)}`);
          if (requestId !== selectSessionRequest) return;
          state.sessions = data.sessions || state.sessions;
          state.current = data.session;
          localStorage.setItem("hermes.activeSession", sessionId);
          renderCurrent();
          setChatStatus("已切换会话");
        } catch (error) {
          if (requestId !== selectSessionRequest) return;
          setChatStatus(error.message, "err");
        }
      }

      async function selectSessionFromUi(sessionId) {
        if (!sessionId || state.busy || state.callActive || sessionId === state.current?.id) return;
        state.busy = true;
        setIdleVoiceControls();
        try {
          await selectSession(sessionId);
        } finally {
          state.busy = false;
          setIdleVoiceControls();
        }
      }

      async function ensureSession() {
        if (state.current) return state.current;
        if (state.sessions.length) {
          await selectSession(state.sessions[0].id);
          return state.current;
        }
        return createSession();
      }

      function applySessionPayload(data) {
        state.current = data.session || state.current;
        state.sessions = data.sessions || state.sessions;
        if (state.current) {
          localStorage.setItem("hermes.activeSession", state.current.id);
        }
        renderCurrent();
      }

      async function playAudio(url, options = {}) {
        if (!url) return;
        if (state.playTarget === "pi") {
          const data = await requestJSON("/api/pi-playback", {
            method: "POST",
            body: {
              audio_url: url,
              wait: Boolean(options.waitForCompletion),
            },
            signal: options.signal,
          });
          setChatStatus(`已发送到树莓派播放：${data.player || "播放器"}`, "ok");
          return;
        }

        const audio = options.audioElement || new Audio();
        audio.pause();
        audio.src = url;
        audio.playsInline = true;
        audio.currentTime = 0;
        return new Promise((resolve, reject) => {
          const signal = options.signal;
          let settled = false;
          let playbackTimer;
          const cleanup = () => {
            clearTimeout(playbackTimer);
            audio.removeEventListener("ended", onEnded);
            audio.removeEventListener("error", onPlaybackError);
            if (signal) signal.removeEventListener("abort", onAbort);
          };
          const finish = (callback, value) => {
            if (settled) return;
            settled = true;
            cleanup();
            callback(value);
          };
          const onEnded = () => finish(resolve);
          const onPlaybackError = () =>
            finish(
              reject,
              callError("语音回复播放失败", "playback_error"),
            );
          const onPlaybackTimeout = () => {
            audio.pause();
            finish(reject, callError("语音回复播放超时", "playback_timeout"));
          };
          const onAbort = () => {
            audio.pause();
            audio.removeAttribute("src");
            finish(reject, new DOMException("语音模式已结束", "AbortError"));
          };

          if (signal && signal.aborted) {
            onAbort();
            return;
          }
          audio.addEventListener("ended", onEnded, { once: true });
          audio.addEventListener("error", onPlaybackError, { once: true });
          if (signal) signal.addEventListener("abort", onAbort, { once: true });
          playbackTimer = setTimeout(onPlaybackTimeout, Math.max(10000, Number(options.playbackTimeoutMs || 180000)));
          audio.play().catch((error) => {
            finish(
              reject,
              callError(
                error && error.name === "NotAllowedError"
                  ? "浏览器阻止了自动播放，请重新点击开启语音"
                  : `语音回复播放失败：${error.message || error}`,
                "playback_error",
                { cause: error },
              ),
            );
          });
        });
      }

      async function sendText(event) {
        event.preventDefault();
        const message = els.textInput.value.trim();
        if (!message || state.busy) return;
        const speak = els.speakReply.checked && canGenerateSpokenReply();

        state.busy = true;
        setIdleVoiceControls();
        setBadge(els.chatBadge, "生成中");
        setChatStatus("小七正在回复。");

        try {
          const session = await ensureSession();
          if (!session) throw new Error("无法创建或选择会话");
          const sessionId = session.id;
          const data = await requestJSON("/api/chat", {
            method: "POST",
            body: {
              session_id: sessionId,
              message,
              speak,
            },
          });
          els.textInput.value = "";
          applySessionPayload(data);
          setBadge(els.chatBadge, "完成", "ok");
          setChatStatus("回复已保存到当前会话。", "ok");
          try {
            await playAudio(data.audio_url);
          } catch (playbackError) {
            setBadge(els.chatBadge, "已保存", "warn");
            setChatStatus(`回复已保存，但播放失败：${playbackError.message}`, "warn");
          }
        } catch (error) {
          setBadge(els.chatBadge, "失败", "err");
          setChatStatus(error.message, "err");
        } finally {
          state.busy = false;
          setIdleVoiceControls();
          els.textInput.focus();
        }
      }

      function getRecorderOptions() {
        if (!window.MediaRecorder) return null;
        const choices = [
          ["audio/webm;codecs=opus", "recording.webm"],
          ["audio/webm", "recording.webm"],
          ["audio/mp4", "recording.m4a"],
          ["audio/ogg;codecs=opus", "recording.ogg"],
        ];
        for (const [mimeType, filename] of choices) {
          if (MediaRecorder.isTypeSupported(mimeType)) {
            return { options: { mimeType }, mimeType, filename };
          }
        }
        return { options: {}, mimeType: "", filename: "recording.webm" };
      }

      function callError(message, code, options = {}) {
        if (window.XiaoQiCallMode && window.XiaoQiCallMode.CallModeError) {
          return new window.XiaoQiCallMode.CallModeError(message, code, options);
        }
        const error = new Error(message);
        error.name = "CallModeError";
        error.code = code || "call_error";
        error.fatal = Boolean(options.fatal);
        if (options.cause !== undefined) error.cause = options.cause;
        return error;
      }

      function microphoneUnavailableMessage() {
        if (!window.isSecureContext) {
          return "当前通过局域网 HTTP 访问，浏览器麦克风不可用；可以选择小七本机麦克风（若可用）。若要使用此设备的麦克风，需要另行启用可信 HTTPS。";
        }
        return "当前浏览器不支持麦克风录音";
      }

      function primeCallMedia() {
        const tasks = [];
        if (!callAudio) {
          callAudio = new Audio();
          callAudio.playsInline = true;
        }

        callAudio.muted = true;
        callAudio.src =
          "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";
        const playback = callAudio.play();
        if (playback && typeof playback.then === "function") tasks.push(playback);

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
          if (!callAudioContext || callAudioContext.state === "closed") {
            callAudioContext = new AudioContext();
          }
          if (callAudioContext.state === "suspended") tasks.push(callAudioContext.resume());
        }

        return Promise.allSettled(tasks).then(() => {
          callAudio.pause();
          callAudio.removeAttribute("src");
          callAudio.muted = false;
        });
      }

      function getCallMicrophone(signal) {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          return Promise.reject(callError(microphoneUnavailableMessage(), "microphone_unavailable", { fatal: true }));
        }

        const mediaPromise = navigator.mediaDevices.getUserMedia({
          audio: {
            autoGainControl: true,
            channelCount: 1,
            echoCancellation: true,
            noiseSuppression: true,
          },
        });
        return new Promise((resolve, reject) => {
          let settled = false;
          const cleanup = () => signal.removeEventListener("abort", onAbort);
          const finish = (callback, value) => {
            if (settled) return;
            settled = true;
            cleanup();
            callback(value);
          };
          const onAbort = () => finish(reject, new DOMException("语音模式已结束", "AbortError"));

          if (signal.aborted) {
            onAbort();
          } else {
            signal.addEventListener("abort", onAbort, { once: true });
          }

          mediaPromise.then(
            (mediaStream) => {
              if (signal.aborted || settled) {
                mediaStream.getTracks().forEach((track) => track.stop());
                if (!settled) onAbort();
                return;
              }
              finish(resolve, mediaStream);
            },
            (error) => {
              const permissionDenied = error && ["NotAllowedError", "SecurityError"].includes(error.name);
              finish(
                reject,
                callError(
                  permissionDenied ? "麦克风权限被拒绝，请允许后重新开启语音" : `无法打开麦克风：${error.message || error}`,
                  permissionDenied ? "permission_denied" : "microphone_error",
                  { fatal: permissionDenied, cause: error },
                ),
              );
            },
          );
        });
      }

      function waitForCallPoll(ms, signal) {
        return new Promise((resolve, reject) => {
          if (signal.aborted) {
            reject(new DOMException("语音模式已结束", "AbortError"));
            return;
          }
          const timeout = setTimeout(() => {
            signal.removeEventListener("abort", onAbort);
            resolve();
          }, ms);
          const onAbort = () => {
            clearTimeout(timeout);
            reject(new DOMException("语音模式已结束", "AbortError"));
          };
          signal.addEventListener("abort", onAbort, { once: true });
        });
      }

      function stopPiCallJob(jobId) {
        if (!jobId) return Promise.resolve();
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 12000);
        return fetch(`/api/pi-record/${encodeURIComponent(jobId)}/stop`, {
          method: "POST",
          keepalive: true,
          signal: controller.signal,
        }).catch(() => undefined).finally(() => clearTimeout(timeout));
      }

      function piCallJobFinished(job) {
        return ["complete", "error", "cancelled"].includes(job?.status);
      }

      async function drainPiCallJob(jobId, signal, stopPromise) {
        if (signal.aborted) return;
        await new Promise((resolve) => {
          const done = () => {
            signal.removeEventListener("abort", done);
            resolve();
          };
          signal.addEventListener("abort", done, { once: true });
          Promise.resolve(stopPromise).then(done, done);
        });
        const deadline = Date.now() + 15000;
        while (!signal.aborted && Date.now() < deadline) {
          try {
            const job = await requestJSON(`/api/pi-record/${encodeURIComponent(jobId)}`, {
              signal,
              timeoutMs: Math.min(3000, Math.max(1000, deadline - Date.now())),
            });
            if (piCallJobFinished(job)) return;
          } catch (error) {
            if (signal.aborted || error.status === 404) return;
          }
          try {
            await waitForCallPoll(250, signal);
          } catch (error) {
            if (signal.aborted) return;
            throw error;
          }
        }
        if (!signal.aborted) {
          throw callError("上一轮小七语音尚未结束，请稍后重新开启语音", "pi_job_cleanup_failed", { fatal: true });
        }
      }

      async function capturePiCallTurn({ signal }) {
        if (!canUsePiRecord()) {
          throw callError("小七麦克风当前不可用", "pi_microphone_unavailable", { fatal: true });
        }
        const duration = piCallTurnDuration();
        const started = await requestJSON("/api/pi-record/start", {
          method: "POST",
          body: {
            duration,
            session_id: callSessionId,
            stream: true,
          },
          signal,
          timeoutMs: 12000,
        });
        const jobId = String(started.job_id || "");
        if (!jobId) {
          throw callError("小七麦克风没有返回录音任务", "pi_record_job_missing");
        }

        let jobFinished = false;
        let handedOff = false;
        let stopPromise;
        const requestStop = () => {
          if (!jobFinished && !handedOff && !stopPromise) stopPromise = stopPiCallJob(jobId);
          return stopPromise;
        };
        signal.addEventListener("abort", requestStop, { once: true });

        try {
          while (!signal.aborted) {
            const job = await requestJSON(`/api/pi-record/${encodeURIComponent(jobId)}`, {
              signal,
              timeoutMs: 12000,
            });
            jobFinished = piCallJobFinished(job);
            const elapsed = Math.max(0, Number(job.elapsed || 0));
            const readySegments = Array.isArray(job.segments)
              ? job.segments.filter((segment) => segment && segment.audio_url)
              : [];
            els.bar.style.width = `${Math.min(100, (elapsed / duration) * 100)}%`;

            if (
              job.stream_requested &&
              readySegments.length &&
              ["streaming", "complete"].includes(job.status)
            ) {
              handedOff = true;
              return {
                kind: "pi_stream",
                data: {
                  stream_job_id: jobId,
                  initial_job: job,
                  transcript: job.transcript || job.result?.transcript || "",
                  audio_url: readySegments[0].audio_url,
                },
                duration: Number(job.result?.duration || duration),
                sessionId: callSessionId,
              };
            }

            if (job.status === "recording") {
              els.callState.textContent = "小七麦克风正在听";
              setVoiceStatus(`正在使用小七麦克风收音 ${elapsed}s；${piCallEndpointSummary()}。`);
            } else if (job.status === "processing") {
              els.callState.textContent = "已收音，小七正在思考";
              setVoiceStatus("小七麦克风已关闭，正在转写并生成回复。");
            } else if (job.status === "streaming") {
              els.callState.textContent = "首句语音正在准备";
              setVoiceStatus("小七正在准备第一句语音。");
            } else if (job.status === "complete") {
              const result = job.result || {};
              if (!String(result.transcript || "").trim()) {
                throw callError("没有识别到清晰语音", "no_speech");
              }
              return {
                kind: "pi_reply",
                data: result,
                duration: Number(result.duration || duration),
                sessionId: callSessionId,
              };
            } else if (job.status === "error") {
              const message = String(job.error || "小七麦克风录音失败");
              if (/no\s+(?:valid\s+)?speech|没有.{0,16}语音|未识别.{0,16}语音/i.test(message)) {
                throw callError("没有识别到清晰语音", "no_speech");
              }
              throw callError(message, "pi_record_failed");
            } else if (job.status === "cancelled") {
              throw new DOMException("语音模式已结束", "AbortError");
            }

            await waitForCallPoll(["processing", "streaming"].includes(job.status) ? 250 : 500, signal);
          }
          throw new DOMException("语音模式已结束", "AbortError");
        } finally {
          signal.removeEventListener("abort", requestStop);
          const stopping = requestStop();
          if (stopping && !signal.aborted) await drainPiCallJob(jobId, signal, stopping);
        }
      }

      async function captureCallTurn({ signal }) {
        if (state.inputTarget === "pi") {
          return capturePiCallTurn({ signal });
        }
        if (!voiceAvailable()) {
          throw callError("浏览器识别和后端转写都不可用", "speech_unavailable", { fatal: true });
        }

        const mediaStream = await getCallMicrophone(signal);
        if (signal.aborted) {
          mediaStream.getTracks().forEach((track) => track.stop());
          throw new DOMException("语音模式已结束", "AbortError");
        }

        const turnStartedAt = Date.now();
        const maxTurnMs = Math.max(5000, Math.min(300000, state.duration * 1000));
        const noSpeechTimeoutMs = Math.min(maxTurnMs, 12000);
        const silenceMs = 1100;
        const calibrationMs = 200;
        const recorderConfig = canUseBackendStt() ? getRecorderOptions() : null;

        if (!SpeechRecognition && !recorderConfig) {
          mediaStream.getTracks().forEach((track) => track.stop());
          throw callError("当前浏览器无法录音，后端转写也未就绪", "speech_unavailable", { fatal: true });
        }

        if (callAudioContext && callAudioContext.state === "suspended") {
          try {
            await callAudioContext.resume();
          } catch {
            // SpeechRecognition can still provide endpointing when Web Audio is unavailable.
          }
        }

        return new Promise((resolve, reject) => {
          let localRecognition;
          let localRecorder;
          let analyser;
          let sourceNode;
          let vadData;
          let vadTimer;
          let endpointTimer;
          let noSpeechTimer;
          let maxTimer;
          let forceFinalizeTimer;
          let stopping = false;
          let settled = false;
          let recognitionFinished = !SpeechRecognition;
          let recorderFinished = !recorderConfig;
          let terminalError = null;
          let finalTranscript = "";
          let interimTranscript = "";
          let heardSpeech = false;
          let loudFrames = 0;
          let noiseFloor = 0.006;
          const localChunks = [];
          let localMimeType = recorderConfig ? recorderConfig.mimeType : "audio/webm";
          const localFilename = recorderConfig ? recorderConfig.filename : "recording.webm";

          const cleanup = () => {
            clearTimeout(vadTimer);
            clearTimeout(endpointTimer);
            clearTimeout(noSpeechTimer);
            clearTimeout(maxTimer);
            clearTimeout(forceFinalizeTimer);
            signal.removeEventListener("abort", onAbort);
            if (sourceNode) sourceNode.disconnect();
            if (analyser) analyser.disconnect();
            mediaStream.getTracks().forEach((track) => track.stop());
          };

          const finish = (callback, value) => {
            if (settled) return;
            settled = true;
            cleanup();
            callback(value);
          };

          const finalize = (force = false) => {
            if (!stopping || settled) return;
            if (!force && (!recognitionFinished || !recorderFinished)) return;

            if (signal.aborted) {
              finish(reject, new DOMException("语音模式已结束", "AbortError"));
              return;
            }
            if (terminalError) {
              finish(reject, terminalError);
              return;
            }

            const duration = Math.max(1, Math.round((Date.now() - turnStartedAt) / 1000));
            if (heardSpeech && localChunks.length && recorderConfig) {
              finish(resolve, {
                blob: new Blob(localChunks, { type: localMimeType || "audio/webm" }),
                duration,
                filename: localFilename,
                kind: "audio",
                sessionId: callSessionId,
              });
              return;
            }
            const cleanedTranscript = (finalTranscript || (!recorderConfig ? interimTranscript : "")).trim();
            if (cleanedTranscript) {
              finish(resolve, {
                duration,
                kind: "transcript",
                sessionId: callSessionId,
                transcript: cleanedTranscript,
              });
              return;
            }
            finish(reject, callError("没有听到清晰语音", "no_speech"));
          };

          const requestStop = (reason, error = null) => {
            if (stopping) {
              if (error && !terminalError) terminalError = error;
              return;
            }
            stopping = true;
            terminalError = error;
            clearTimeout(vadTimer);
            clearTimeout(endpointTimer);
            clearTimeout(noSpeechTimer);
            clearTimeout(maxTimer);
            els.bar.style.width = reason === "silence" || reason === "max_duration" ? "100%" : els.bar.style.width;

            try {
              if (localRecognition) localRecognition.stop();
              else recognitionFinished = true;
            } catch {
              recognitionFinished = true;
            }
            try {
              if (localRecorder && localRecorder.state !== "inactive") localRecorder.stop();
              else recorderFinished = true;
            } catch {
              recorderFinished = true;
            }
            mediaStream.getTracks().forEach((track) => track.stop());
            forceFinalizeTimer = setTimeout(() => finalize(true), 900);
            finalize();
          };

          const markSpeech = () => {
            if (stopping) return;
            heardSpeech = true;
            clearTimeout(endpointTimer);
            endpointTimer = setTimeout(() => requestStop("silence"), silenceMs);
          };

          const onAbort = () =>
            requestStop("aborted", new DOMException("语音模式已结束", "AbortError"));
          signal.addEventListener("abort", onAbort, { once: true });

          if (SpeechRecognition) {
            try {
              localRecognition = new SpeechRecognition();
              localRecognition.lang = "zh-CN";
              localRecognition.continuous = true;
              localRecognition.interimResults = true;
              localRecognition.addEventListener("result", (event) => {
                if (stopping) return;
                const finalParts = [];
                const interimParts = [];
                for (let index = 0; index < event.results.length; index += 1) {
                  const result = event.results[index];
                  const text = result[0].transcript;
                  if (result.isFinal) finalParts.push(text);
                  else interimParts.push(text);
                }
                finalTranscript = finalParts.join("").trim();
                interimTranscript = interimParts.join("").trim();
                const preview = `${finalTranscript}${interimTranscript}`.trim();
                els.transcriptPreview.textContent = preview || "正在识别。";
                if (preview) markSpeech();
              });
              localRecognition.addEventListener("speechstart", markSpeech);
              localRecognition.addEventListener("speechend", () => {
                if (heardSpeech) markSpeech();
              });
              localRecognition.addEventListener("end", () => {
                recognitionFinished = true;
                if (!stopping && (finalTranscript || interimTranscript || !localRecorder)) {
                  requestStop("recognition_end");
                }
                finalize();
              });
              localRecognition.addEventListener("error", (event) => {
                recognitionFinished = true;
                if (stopping || event.error === "aborted") {
                  finalize();
                  return;
                }
                if (["not-allowed", "service-not-allowed", "audio-capture"].includes(event.error)) {
                  if (recorderConfig) {
                    els.transcriptPreview.textContent = "浏览器转写不可用，继续使用后端转写。";
                    return;
                  }
                  requestStop(
                    "recognition_error",
                    callError("浏览器语音识别权限不可用", "permission_denied", { fatal: true }),
                  );
                  return;
                }
                if (!localRecorder && event.error !== "no-speech") {
                  requestStop(
                    "recognition_error",
                    callError(`浏览器语音识别失败：${event.error}`, "recognition_error"),
                  );
                }
              });
              localRecognition.start();
              recognitionFinished = false;
            } catch (error) {
              recognitionFinished = true;
              localRecognition = undefined;
              if (!recorderConfig) {
                requestStop(
                  "recognition_error",
                  callError(`无法启动浏览器语音识别：${error.message || error}`, "recognition_error"),
                );
              }
            }
          }

          if (recorderConfig && !stopping) {
            try {
              localRecorder = new MediaRecorder(mediaStream, recorderConfig.options);
              localMimeType = localRecorder.mimeType || recorderConfig.mimeType || "audio/webm";
              localRecorder.addEventListener("dataavailable", (event) => {
                if (event.data.size > 0) localChunks.push(event.data);
              });
              localRecorder.addEventListener("stop", () => {
                recorderFinished = true;
                finalize();
              });
              localRecorder.addEventListener("error", () => {
                recorderFinished = true;
                requestStop("recording_error", callError("浏览器录音失败", "recording_error"));
              });
              localRecorder.start(250);
              recorderFinished = false;
            } catch (error) {
              recorderFinished = true;
              localRecorder = undefined;
              if (!localRecognition) {
                requestStop(
                  "recording_error",
                  callError(`无法启动浏览器录音：${error.message || error}`, "recording_error"),
                );
              }
            }
          }

          if (callAudioContext && callAudioContext.state !== "closed" && !stopping) {
            try {
              sourceNode = callAudioContext.createMediaStreamSource(mediaStream);
              analyser = callAudioContext.createAnalyser();
              analyser.fftSize = 1024;
              analyser.smoothingTimeConstant = 0.2;
              sourceNode.connect(analyser);
              vadData = new Uint8Array(analyser.fftSize);

              const sampleVoiceActivity = () => {
                if (stopping) return;
                analyser.getByteTimeDomainData(vadData);
                let sumSquares = 0;
                for (const value of vadData) {
                  const normalized = (value - 128) / 128;
                  sumSquares += normalized * normalized;
                }
                const rms = Math.sqrt(sumSquares / vadData.length);
                const elapsed = Date.now() - turnStartedAt;
                if (!heardSpeech && elapsed < calibrationMs && rms < 0.03) {
                  noiseFloor = noiseFloor * 0.82 + rms * 0.18;
                }
                const threshold = Math.max(0.02, noiseFloor * 3.2);
                if (elapsed >= calibrationMs && rms >= threshold) {
                  loudFrames += 1;
                  if (loudFrames >= 5) markSpeech();
                } else {
                  loudFrames = 0;
                }
                els.bar.style.width = `${Math.min(100, Math.max(2, rms * 850))}%`;
                vadTimer = setTimeout(sampleVoiceActivity, 40);
              };
              sampleVoiceActivity();
            } catch {
              sourceNode = undefined;
              analyser = undefined;
            }
          }

          noSpeechTimer = setTimeout(() => {
            if (!heardSpeech && !finalTranscript && !interimTranscript) requestStop("no_speech");
          }, noSpeechTimeoutMs);
          maxTimer = setTimeout(() => requestStop("max_duration"), maxTurnMs);
        });
      }

      async function processCallTurn(turn, { signal }) {
        try {
          let data;
          const sessionId = turn.sessionId || callSessionId;
          if (!sessionId) {
            throw callError("语音会话丢失，请重新开启语音", "session_missing", { fatal: true });
          }
          if (["pi_reply", "pi_stream"].includes(turn.kind)) {
            data = turn.data;
          } else if (turn.kind === "transcript") {
            data = await requestJSON("/api/respond", {
              method: "POST",
              body: {
                duration: turn.duration,
                transcript: turn.transcript,
                session_id: sessionId,
              },
              signal,
            });
          } else {
            const form = new FormData();
            form.append("duration", String(turn.duration));
            form.append("session_id", sessionId);
            form.append("audio", turn.blob, turn.filename);
            data = await requestJSON("/api/converse", { method: "POST", body: form, signal });
          }

          if (data.session) applySessionPayload(data);
          setCallUiLock(true);
          els.transcriptPreview.textContent = data.transcript || turn.transcript || "";
          return data;
        } catch (error) {
          if (window.XiaoQiCallMode?.isNoSpeechError(error)) {
            throw callError("没有识别到清晰语音", "no_speech", { cause: error });
          }
          const message = String(error && error.message ? error.message : error || "");
          if (
            [401, 403].includes(error && error.status) ||
            /invalid\s*api\s*key|unauthori[sz]ed|authentication|api\s*key.{0,12}(?:invalid|error)/i.test(message)
          ) {
            throw callError("模型服务认证失败，请检查 API Key 后再试", "provider_auth_failed", {
              fatal: true,
              cause: error,
            });
          }
          throw error;
        }
      }

      function piStreamingSegments(job) {
        const live = Array.isArray(job?.segments) ? job.segments : [];
        const completed = Array.isArray(job?.result?.audio_segments) ? job.result.audio_segments : [];
        return (live.length ? live : completed)
          .filter((segment) => segment && segment.audio_url)
          .map((segment, index) => ({
            ...segment,
            sequence: Number.isFinite(Number(segment.sequence)) ? Number(segment.sequence) : index,
          }))
          .sort((left, right) => left.sequence - right.sequence);
      }

      async function playPiStreamingReply(data, { signal }) {
        const jobId = String(data?.stream_job_id || "");
        if (!jobId) throw callError("小七没有返回流式语音任务", "reply_audio_missing");

        let job = data.initial_job || {};
        const played = new Set();
        let stopPromise;
        const requestStop = () => {
          if (!piCallJobFinished(job) && !stopPromise) stopPromise = stopPiCallJob(jobId);
          return stopPromise;
        };
        signal.addEventListener("abort", requestStop, { once: true });

        try {
          while (!signal.aborted) {
            const segments = piStreamingSegments(job);
            for (const segment of segments) {
              if (played.has(segment.sequence)) continue;
              els.callState.textContent = `小七正在播放第 ${segment.sequence + 1} 句`;
              setVoiceStatus(
                `回答正在通过${state.playTarget === "pi" ? "小七音箱" : "浏览器扬声器"}播放，后续内容同时生成中。`,
                "ok",
              );
              if (!callAudio) callAudio = new Audio();
              await playAudio(segment.audio_url, {
                audioElement: callAudio,
                signal,
                waitForCompletion: true,
              });
              played.add(segment.sequence);
            }

            if (job.status === "complete") {
              const result = job.result || {};
              if (result.session) applySessionPayload(result);
              els.transcriptPreview.textContent = result.transcript || job.transcript || data.transcript || "";
              return result;
            }
            if (job.status === "error") {
              throw callError(String(job.error || "小七流式语音生成失败"), "pi_record_failed");
            }
            if (job.status === "cancelled") {
              throw new DOMException("语音模式已结束", "AbortError");
            }

            await waitForCallPoll(250, signal);
            job = await requestJSON(`/api/pi-record/${encodeURIComponent(jobId)}`, {
              signal,
              timeoutMs: 12000,
            });
          }
          throw new DOMException("语音模式已结束", "AbortError");
        } finally {
          signal.removeEventListener("abort", requestStop);
          const stopping = requestStop();
          if (stopping && !signal.aborted) await drainPiCallJob(jobId, signal, stopping);
        }
      }

      async function playCallReply(data, { signal }) {
        if (data?.stream_job_id) {
          await playPiStreamingReply(data, { signal });
          return;
        }
        if (!data || !data.audio_url) {
          throw callError("小七没有返回可播放的语音", "reply_audio_missing");
        }
        if (!callAudio) callAudio = new Audio();
        await playAudio(data.audio_url, {
          audioElement: callAudio,
          signal,
          waitForCompletion: true,
        });
      }

      function setCallUiLock(locked) {
        setWorkspaceLock(locked);
      }

      function renderCallState(event) {
        const current = event.state;
        els.callIndicator.className = `call-indicator ${current}`;
        window.XiaoQiUI?.morph(els.callIndicator.parentElement);
        if (current === XiaoQiCallMode.CALL_STATES.LISTENING) {
          const usePiInput = state.inputTarget === "pi";
          els.callState.textContent = usePiInput ? "小七麦克风正在听" : "正在听，请直接说话";
          setBadge(els.voiceBadge, "语音中 · 正在听", "ok");
          setVoiceStatus(
            usePiInput
              ? `正在使用小七麦克风收音；${piCallEndpointSummary()}。`
              : "正在听你说话；说完保持安静约 1.1 秒即可自动发送。",
          );
          els.bar.style.width = "0%";
        } else if (current === XiaoQiCallMode.CALL_STATES.PROCESSING) {
          els.callState.textContent = "已收句，小七正在思考";
          setBadge(els.voiceBadge, "语音中 · 思考");
          setVoiceStatus("麦克风已关闭，正在转写并生成回复。");
          els.bar.style.width = "100%";
        } else if (current === XiaoQiCallMode.CALL_STATES.SPEAKING) {
          els.callState.textContent = state.playTarget === "pi" ? "小七音箱正在播放" : "小七正在说话";
          setBadge(els.voiceBadge, "语音中 · 小七说话");
          setVoiceStatus(
            `回答正在通过${state.playTarget === "pi" ? "小七音箱" : "浏览器扬声器"}播放；结束后会自动继续收音。`,
            "ok",
          );
        } else if (current === XiaoQiCallMode.CALL_STATES.RECOVERING) {
          if (event.reason === "no_speech") {
            els.callState.textContent = "没有听清，正在继续听";
            setBadge(els.voiceBadge, "语音中 · 重听");
            setVoiceStatus("这轮没有听到清晰语音，正在自动重新收音。");
          } else {
            els.callState.textContent = `连接波动，正在重试（${event.consecutiveErrors}/3）`;
            setBadge(els.voiceBadge, "语音中 · 重试");
            setVoiceStatus(event.error ? event.error.message : "正在恢复语音会话。", "err");
          }
        } else if (current === XiaoQiCallMode.CALL_STATES.ENDED) {
          state.callActive = false;
          const failed = ["fatal_error", "error_limit", "loop_finished"].includes(event.reason);
          els.callState.textContent = failed ? "语音模式因错误结束" : "语音模式已结束";
          setBadge(els.voiceBadge, failed ? "语音异常结束" : "已结束", failed ? "err" : "");
          if (event.error) setVoiceStatus(event.error.message, "err");
          else setVoiceStatus("语音模式已结束，可再次点击开启语音。");
          if (["正在等待语音。", "正在识别。", "正在听，请直接说话"].includes(els.transcriptPreview.textContent)) {
            els.transcriptPreview.textContent = "语音模式已结束。";
          }
          els.bar.style.width = "0%";
          setIdleVoiceControls();
        }
      }

      function finishCallUi() {
        state.callActive = false;
        state.busy = false;
        callSessionId = "";
        setCallUiLock(false);
        setIdleVoiceControls();
        if (["正在等待语音。", "正在识别。", "正在听，请直接说话"].includes(els.transcriptPreview.textContent)) {
          els.transcriptPreview.textContent = "语音模式已结束。";
        }
        if (callAudio) callAudio.pause();
        if (callAudioContext && callAudioContext.state === "running") {
          callAudioContext.suspend().catch(() => {});
        }
      }

      async function startCall() {
        if (state.busy || state.callActive) return;
        if (!callController) {
          throw callError("语音模式组件未加载", "call_controller_missing", { fatal: true });
        }
        if (!selectedInputAvailable()) {
          throw callError(
            state.inputTarget === "pi" ? "小七麦克风当前不可用" : "浏览器麦克风当前不可用",
            "speech_unavailable",
            { fatal: true },
          );
        }

        state.busy = true;
        els.startCall.disabled = true;
        els.callState.textContent = "正在开启语音";
        setBadge(els.voiceBadge, "准备中");
        const needsBrowserMedia = state.inputTarget === "browser" || state.playTarget === "browser";
        const mediaUnlock = needsBrowserMedia ? primeCallMedia() : Promise.resolve();

        try {
          const session = await ensureSession();
          if (!session) {
            throw callError("无法创建或选择会话", "session_missing", { fatal: true });
          }
          callSessionId = session.id;
          await mediaUnlock;
          const inputLabel = state.inputTarget === "pi" ? "小七麦克风" : "浏览器麦克风";
          const outputLabel = state.playTarget === "pi" ? "小七音箱" : "浏览器扬声器";
          renderInputTarget();
          renderPlayTarget();
          setChatStatus(`语音模式已连接：${inputLabel} → ${outputLabel}。`, "ok");
          state.callActive = true;
          setCallUiLock(true);
          setIdleVoiceControls();

          callController
            .start()
            .catch((error) => {
              setBadge(els.voiceBadge, "语音启动失败", "err");
              setVoiceStatus(error.message || String(error), "err");
            })
            .finally(finishCallUi);
        } catch (error) {
          finishCallUi();
          throw error;
        }
      }

      function hangUpCall() {
        if (!callController || !callController.isActive()) return;
        els.hangUp.disabled = true;
        els.callState.textContent = "正在结束语音";
        callController.hangUp("user");
      }

      function resetRecordingControls() {
        clearTimeout(timer);
        clearInterval(progress);
        const activeRecognition = recognition;
        const activeRecorder = recorder;
        const activeStream = stream;
        recognition = undefined;
        recorder = undefined;
        stream = undefined;
        try {
          if (activeRecognition) activeRecognition.abort();
        } catch {
          // Recognition may already be closed.
        }
        try {
          if (activeRecorder && activeRecorder.state !== "inactive") activeRecorder.stop();
        } catch {
          // Recorder may already be closed.
        }
        if (activeStream) {
          activeStream.getTracks().forEach((track) => track.stop());
        }
        state.busy = false;
        recordingMode = "";
        stopPending = false;
        submitted = false;
        recordingSessionId = "";
        browserTranscript = "";
        browserInterimTranscript = "";
        recordedDuration = 1;
        setIdleVoiceControls();
      }

      function maybeFinishRecording() {
        if (!stopPending || submitted) return;
        if (!recognitionDone || !recorderDone) return;
        finishRecording();
      }

      async function finishRecording() {
        if (submitted) return;
        submitted = true;
        els.record.disabled = true;
        els.stop.disabled = true;

        if (chunks.length && canUseBackendStt()) {
          await submitRecording(recordedDuration);
          return;
        }

        const fallbackTranscript = browserTranscript || browserInterimTranscript;
        if (fallbackTranscript) {
          await submitTranscript(recordedDuration, fallbackTranscript);
          return;
        }

        setBadge(els.voiceBadge, "无语音", "err");
        setVoiceStatus("没有识别到语音，或后端转写尚未就绪。", "err");
        resetRecordingControls();
      }

      async function startRecording() {
        if (state.busy) return;
        state.busy = true;
        setIdleVoiceControls();
        if (!voiceAvailable()) {
          throw new Error("当前浏览器和后端转写都不可用");
        }
        if (!browserMicrophoneAvailable()) throw new Error(microphoneUnavailableMessage());

        const session = await ensureSession();
        if (!session) throw new Error("无法创建或选择会话");
        recordingSessionId = session.id;
        recordingMode = "browser";
        activeDuration = state.duration;
        chunks = [];
        browserTranscript = "";
        browserInterimTranscript = "";
        recordedDuration = 1;
        submitted = false;
        stopPending = false;
        recognitionDone = true;
        recorderDone = true;
        els.bar.style.width = "0%";
        els.transcriptPreview.textContent = "正在等待语音。";

        stream = await navigator.mediaDevices.getUserMedia({ audio: true });

        if (SpeechRecognition) {
          recognitionDone = false;
          recognition = new SpeechRecognition();
          recognition.lang = "zh-CN";
          recognition.continuous = true;
          recognition.interimResults = true;
          recognition.addEventListener("result", (event) => {
            const finalParts = [];
            const interimParts = [];
            for (let i = 0; i < event.results.length; i += 1) {
              const result = event.results[i];
              const text = result[0].transcript;
              if (result.isFinal) finalParts.push(text);
              else interimParts.push(text);
            }
            browserTranscript = finalParts.join("").trim();
            browserInterimTranscript = interimParts.join("").trim();
            els.transcriptPreview.textContent =
              `${browserTranscript}${browserInterimTranscript}`.trim() || "正在识别。";
          });
          recognition.addEventListener("end", () => {
            recognitionDone = true;
            maybeFinishRecording();
          });
          recognition.addEventListener("error", () => {
            recognitionDone = true;
            maybeFinishRecording();
          });
          recognition.start();
        }

        const recorderConfig = canUseBackendStt() ? getRecorderOptions() : null;
        if (recorderConfig) {
          recorderDone = false;
          recorder = new MediaRecorder(stream, recorderConfig.options);
          recordingMimeType = recorder.mimeType || recorderConfig.mimeType || "audio/webm";
          recordingFilename = recorderConfig.filename;
          recorder.addEventListener("dataavailable", (event) => {
            if (event.data.size > 0) chunks.push(event.data);
          });
          recorder.addEventListener("stop", () => {
            recorderDone = true;
            maybeFinishRecording();
          });
          recorder.start();
        } else if (!SpeechRecognition) {
          throw new Error("当前浏览器不支持录音上传");
        }

        startedAt = Date.now();
        els.record.disabled = true;
        els.piRecord.disabled = true;
        els.stop.disabled = false;
        setBadge(els.voiceBadge, "录音中");
        setVoiceStatus(`最长 ${activeDuration} 秒，说完后可以手动停止。`);

        timer = setTimeout(stopRecording, activeDuration * 1000);
        progress = setInterval(() => {
          const elapsed = Math.max(0, (Date.now() - startedAt) / 1000);
          els.bar.style.width = `${Math.min(100, (elapsed / activeDuration) * 100)}%`;
          setVoiceStatus(`录音中 ${Math.floor(elapsed)}s / ${activeDuration}s`);
        }, 150);
      }

      function stopRecording() {
        if (recordingMode === "pi") {
          stopPiRecording().catch((error) => {
            setBadge(els.voiceBadge, "失败", "err");
            setVoiceStatus(error.message, "err");
            finishPiRecording();
          });
          return;
        }

        if (stopPending) return;
        stopPending = true;
        clearTimeout(timer);
        clearInterval(progress);
        const elapsed = startedAt ? Math.max(0, (Date.now() - startedAt) / 1000) : 0;
        recordedDuration = Math.max(1, Math.min(activeDuration, Math.round(elapsed)));
        els.bar.style.width = `${Math.min(100, (elapsed / activeDuration) * 100)}%`;
        els.stop.disabled = true;
        els.record.disabled = true;
        setBadge(els.voiceBadge, "处理中");
        setVoiceStatus("正在整理录音和转写。");

        try {
          if (recognition) {
            recognition.stop();
          } else {
            recognitionDone = true;
          }
        } catch {
          recognitionDone = true;
        }

        try {
          if (recorder && recorder.state !== "inactive") {
            recorder.stop();
          } else {
            recorderDone = true;
          }
        } catch {
          recorderDone = true;
        }

        if (stream) {
          stream.getTracks().forEach((track) => track.stop());
        }
        maybeFinishRecording();
      }

      async function submitTranscript(duration, transcript = browserTranscript) {
        setVoiceStatus("浏览器转写完成，正在让小七回复。");
        const sessionId = recordingSessionId;
        try {
          if (!sessionId) throw new Error("录音所属会话已丢失，请重新录音");
          const data = await requestJSON("/api/respond", {
            method: "POST",
            body: {
              duration,
              transcript,
              session_id: sessionId,
            },
          });
          applySessionPayload(data);
          els.transcriptPreview.textContent = data.transcript || transcript;
          setBadge(els.voiceBadge, "完成", "ok");
          setVoiceStatus("语音回复已保存到当前会话。", "ok");
          try {
            await playAudio(data.audio_url);
          } catch (playbackError) {
            setBadge(els.voiceBadge, "已保存", "warn");
            setVoiceStatus(`回复已保存，但播放失败：${playbackError.message}`, "warn");
          }
        } catch (error) {
          setBadge(els.voiceBadge, "失败", "err");
          setVoiceStatus(error.message, "err");
        } finally {
          resetRecordingControls();
        }
      }

      async function submitRecording(duration) {
        setVoiceStatus("正在上传录音，由后端转写并生成回复。");
        const blob = new Blob(chunks, { type: recordingMimeType });
        const sessionId = recordingSessionId;
        const form = new FormData();
        form.append("duration", String(duration));
        form.append("session_id", sessionId);
        form.append("audio", blob, recordingFilename);

        try {
          if (!sessionId) throw new Error("录音所属会话已丢失，请重新录音");
          const data = await requestJSON("/api/converse", { method: "POST", body: form });
          applySessionPayload(data);
          els.transcriptPreview.textContent = data.transcript || "";
          setBadge(els.voiceBadge, "完成", "ok");
          setVoiceStatus("语音回复已保存到当前会话。", "ok");
          try {
            await playAudio(data.audio_url);
          } catch (playbackError) {
            setBadge(els.voiceBadge, "已保存", "warn");
            setVoiceStatus(`回复已保存，但播放失败：${playbackError.message}`, "warn");
          }
        } catch (error) {
          setBadge(els.voiceBadge, "失败", "err");
          setVoiceStatus(error.message, "err");
        } finally {
          resetRecordingControls();
        }
      }

      function finishPiRecording() {
        clearInterval(progress);
        clearTimeout(piPoll);
        piRecordJobId = "";
        piPollFailures = 0;
        piStopRequested = false;
        recordingSessionId = "";
        recordingMode = "";
        state.busy = false;
        setIdleVoiceControls();
      }

      async function renderPiJob(data) {
        const elapsed = Math.max(0, Number(data.elapsed || 0));
        const duration = Math.max(1, Number(data.duration || activeDuration || 1));
        els.bar.style.width = `${Math.min(100, (elapsed / duration) * 100)}%`;

        if (data.status === "recording") {
          setBadge(els.voiceBadge, piStopRequested ? "停止中" : "智能助手录音中");
          setVoiceStatus(
            piStopRequested
              ? "正在停止智能助手录音。"
              : `智能助手录音中 ${elapsed}s / ${duration}s，可手动停止。`,
          );
          return false;
        }

        if (data.status === "processing") {
          els.stop.disabled = true;
          setBadge(els.voiceBadge, "处理中");
          setVoiceStatus("录音完成，正在转写并生成回复。");
          return false;
        }

        if (data.status === "complete") {
          const result = data.result || {};
          applySessionPayload(result);
          els.bar.style.width = "100%";
          els.transcriptPreview.textContent = result.transcript || "";
          setBadge(els.voiceBadge, "完成", "ok");
          setVoiceStatus("智能助手录音回复已保存到当前会话。", "ok");
          try {
            await playAudio(result.audio_url);
          } catch (playbackError) {
            setBadge(els.voiceBadge, "已保存", "warn");
            setVoiceStatus(`回复已保存，但播放失败：${playbackError.message}`, "warn");
          }
          finishPiRecording();
          return true;
        }

        if (data.status === "error") {
          const message = data.error || "智能助手录音失败";
          setBadge(els.voiceBadge, "失败", "err");
          setVoiceStatus(message, "err");
          finishPiRecording();
          return true;
        }

        return false;
      }

      async function pollPiRecording() {
        if (!piRecordJobId) return;
        try {
          const data = await requestJSON(`/api/pi-record/${encodeURIComponent(piRecordJobId)}`);
          piPollFailures = 0;
          if (!(await renderPiJob(data))) {
            piPoll = setTimeout(pollPiRecording, data.status === "processing" ? 1500 : 600);
          }
        } catch (error) {
          if (error.status === 404) {
            setBadge(els.voiceBadge, "任务丢失", "err");
            setVoiceStatus("小七录音任务已不存在，请重新录音。", "err");
            finishPiRecording();
            return;
          }
          piPollFailures += 1;
          if (piPollFailures > 5) {
            setBadge(els.voiceBadge, "连接失败", "err");
            setVoiceStatus(`多次无法读取录音进度：${error.message}`, "err");
            finishPiRecording();
            return;
          }
          setBadge(els.voiceBadge, "正在重连", "warn");
          setVoiceStatus(`录音任务仍保留，正在重新连接（${piPollFailures}/5）。`, "warn");
          const retryDelay = Math.min(5000, 600 * 2 ** (piPollFailures - 1));
          piPoll = setTimeout(pollPiRecording, retryDelay);
        }
      }

      async function stopPiRecording() {
        if (!piRecordJobId || piStopRequested) return;
        piStopRequested = true;
        els.stop.disabled = true;
        setBadge(els.voiceBadge, "停止中");
        setVoiceStatus("正在停止智能助手录音。");
        const data = await requestJSON(`/api/pi-record/${encodeURIComponent(piRecordJobId)}/stop`, { method: "POST" });
        await renderPiJob(data);
      }

      async function startPiRecording() {
        if (state.busy) return;
        state.busy = true;
        setIdleVoiceControls();
        if (!canUsePiRecord()) {
          throw new Error("小七本机录音不可用，请检查 arecord 和后端转写状态");
        }

        const session = await ensureSession();
        if (!session) throw new Error("无法创建或选择会话");
        recordingSessionId = session.id;
        activeDuration = state.duration;
        recordingMode = "pi";
        piRecordJobId = "";
        piPollFailures = 0;
        piStopRequested = false;
        clearTimeout(piPoll);
        clearInterval(progress);
        els.record.disabled = true;
        els.piRecord.disabled = true;
        els.stop.disabled = true;
        els.bar.style.width = "0%";
        els.transcriptPreview.textContent = "智能助手麦克风正在录音。";
        setBadge(els.voiceBadge, "智能助手录音中");
        setVoiceStatus(`智能助手正在准备录音，最长 ${activeDuration} 秒。`);

        try {
          const data = await requestJSON("/api/pi-record/start", {
            method: "POST",
            body: {
              duration: activeDuration,
              session_id: recordingSessionId,
              stream: false,
            },
          });
          piRecordJobId = data.job_id;
          startedAt = Date.now();
          els.stop.disabled = false;
          if (await renderPiJob(data)) return;
          progress = setInterval(() => {
            if (!piRecordJobId || piStopRequested) return;
            const elapsed = Math.max(0, (Date.now() - startedAt) / 1000);
            els.bar.style.width = `${Math.min(100, (elapsed / activeDuration) * 100)}%`;
          }, 150);
          piPoll = setTimeout(pollPiRecording, 600);
        } catch (error) {
          setBadge(els.voiceBadge, "失败", "err");
          setVoiceStatus(error.message, "err");
          finishPiRecording();
        }
      }

      async function saveTitle() {
        if (!state.current || state.busy) return;
        const title = els.sessionTitle.value.trim() || "新会话";
        const sessionId = state.current.id;
        state.busy = true;
        setIdleVoiceControls();
        try {
          const data = await requestJSON(`/api/sessions/${encodeURIComponent(sessionId)}`, {
            method: "PATCH",
            body: { title },
          });
          applySessionPayload(data);
          setChatStatus("标题已保存。", "ok");
        } catch (error) {
          setChatStatus(error.message, "err");
        } finally {
          state.busy = false;
          setIdleVoiceControls();
        }
      }

      async function deleteCurrentSession() {
        if (!state.current || state.busy) return;
        if (!confirm("确定删除当前会话？")) return;
        state.busy = true;
        setIdleVoiceControls();
        try {
          const deletedId = state.current.id;
          const data = await requestJSON(`/api/sessions/${encodeURIComponent(deletedId)}`, { method: "DELETE" });
          state.sessions = data.sessions || [];
          state.current = null;
          localStorage.removeItem("hermes.activeSession");
          if (state.sessions.length) {
            await selectSession(state.sessions[0].id);
          } else {
            renderCurrent();
          }
          setChatStatus("会话已删除。", "ok");
        } catch (error) {
          setChatStatus(error.message, "err");
        } finally {
          state.busy = false;
          setIdleVoiceControls();
        }
      }

      if (window.XiaoQiCallMode?.createCallController) {
        callController = window.XiaoQiCallMode.createCallController({
          captureTurn: captureCallTurn,
          maxConsecutiveErrors: 3,
          noSpeechDelayMs: 300,
          onStateChange: renderCallState,
          playReply: playCallReply,
          processTurn: processCallTurn,
          retryDelayMs: 900,
        });
      } else {
        callController = null;
        setVoiceStatus("语音模式组件未加载，手动语音和文字功能仍可使用。", "warn");
      }

      async function init() {
        setDuration(state.duration);
        els.speakReply.checked = localStorage.getItem("hermes.speakReply") === "true";
        renderInputTarget();
        renderPlayTarget();
        window.XiaoQiUI?.mount(document);
        state.busy = true;
        setIdleVoiceControls();
        try {
          const [, sessionsResult] = await Promise.allSettled([loadHealth(), loadSessions()]);
          if (sessionsResult.status === "rejected") throw sessionsResult.reason;

          const saved = localStorage.getItem("hermes.activeSession");
          const target = state.sessions.find((session) => session.id === saved) || state.sessions[0];
          if (target) {
            await selectSession(target.id);
          } else {
            state.current = null;
            localStorage.removeItem("hermes.activeSession");
            renderCurrent();
            setChatStatus("输入文字或开始语音时，小七会自动创建会话。");
          }
          setBadge(els.chatBadge, "待机");
        } finally {
          state.busy = false;
          setIdleVoiceControls();
        }
      }

      els.composer.addEventListener("submit", sendText);
      els.textInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
          event.preventDefault();
          els.composer.requestSubmit();
        }
      });
      els.newSession.addEventListener("click", createSessionFromUi);
      els.saveTitle.addEventListener("click", saveTitle);
      els.deleteSession.addEventListener("click", deleteCurrentSession);
      els.refreshHealth.addEventListener("click", loadHealth);
      els.inputBrowser.addEventListener("click", () => setInputTarget("browser"));
      els.inputPi.addEventListener("click", () => setInputTarget("pi"));
      els.playBrowser.addEventListener("click", () => setPlayTarget("browser"));
      els.playPi.addEventListener("click", () => setPlayTarget("pi"));
      els.startCall.addEventListener("click", () => {
        startCall().catch((error) => {
          els.callIndicator.className = "call-indicator ended";
          els.callState.textContent = "无法开启语音";
          setBadge(els.voiceBadge, "语音启动失败", "err");
          setVoiceStatus(error.message, "err");
          finishCallUi();
        });
      });
      els.hangUp.addEventListener("click", hangUpCall);
      els.record.addEventListener("click", () => {
        startRecording().catch((error) => {
          setBadge(els.voiceBadge, "失败", "err");
          setVoiceStatus(error.message, "err");
          resetRecordingControls();
        });
      });
      els.piRecord.addEventListener("click", () => {
        startPiRecording().catch((error) => {
          setBadge(els.voiceBadge, "失败", "err");
          setVoiceStatus(error.message, "err");
          finishPiRecording();
        });
      });
      els.stop.addEventListener("click", stopRecording);
      els.durationRange.addEventListener("input", (event) => setDuration(event.target.value));
      els.durationNumber.addEventListener("change", (event) => setDuration(event.target.value));
      document.querySelectorAll("[data-seconds]").forEach((button) => {
        button.addEventListener("click", () => setDuration(button.dataset.seconds));
      });
      els.speakReply.addEventListener("change", () => {
        localStorage.setItem("hermes.speakReply", String(els.speakReply.checked));
      });

      init().catch((error) => {
        setBadge(els.connectionBadge, "初始化失败", "err");
        setChatStatus(error.message, "err");
      });
    </script>
  </body>
</html>
